<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Background Container -->
  <circle cx="512" cy="512" r="512" fill="#FF7000"/>
  
  <!-- Central Black Shield/Shape for Contrast -->
  <circle cx="512" cy="512" r="460" fill="black"/>

  <!-- Main Orange Liquid Base -->
  <path d="M200 600C200 500 824 500 824 600C824 800 200 800 200 600Z" fill="#FF7000"/>
  
  <!-- Dynamic White Rings (Swirls) -->
  <ellipse cx="512" cy="620" rx="350" ry="120" stroke="white" stroke-width="25" stroke-linecap="round"/>
  <ellipse cx="512" cy="660" rx="280" ry="80" stroke="white" stroke-width="15" stroke-opacity="0.6"/>
  
  <!-- Professional Baby Bottles -->
  <!-- Left Bottle -->
  <g transform="translate(320, 380) rotate(-15)">
    <rect x="0" y="60" width="140" height="240" rx="30" fill="#FF7000" stroke="white" stroke-width="20"/>
    <!-- Milk Level Effect -->
    <rect x="20" y="180" width="100" height="100" rx="10" fill="white" fill-opacity="0.2"/>
    <!-- Bottle Cap -->
    <path d="M20 60L120 60L100 0L40 0L20 60Z" fill="white"/>
    <!-- Sparkle -->
    <path d="M70 120L75 105L80 120L95 125L80 130L75 145L70 130L55 125L70 120Z" fill="white"/>
  </g>
  
  <!-- Right Bottle -->
  <g transform="translate(580, 420) rotate(15)">
    <rect x="0" y="50" width="120" height="200" rx="25" fill="#FF7000" stroke="white" stroke-width="15"/>
    <path d="M15 50L105 50L90 0L30 0L15 50Z" fill="white"/>
  </g>
  
  <!-- Stylized Balloons -->
  <!-- Small Balloon -->
  <g transform="translate(420, 220)">
    <path d="M0 0C-50 -10 -50 -100 0 -110C50 -100 50 -10 0 0Z" fill="#FF7000" stroke="white" stroke-width="10"/>
    <path d="M0 0Q-10 40 0 80" stroke="white" stroke-width="5" fill="none"/>
  </g>
  
  <!-- Large Balloon -->
  <g transform="translate(560, 180)">
    <path d="M0 0C-70 -15 -70 -130 0 -145C70 -130 70 -15 0 0Z" fill="#FF7000" stroke="white" stroke-width="12"/>
    <path d="M0 0Q15 50 0 100" stroke="white" stroke-width="6" fill="none"/>
  </g>
  
  <!-- Accent Bubbles/Dots -->
  <circle cx="250" cy="550" r="20" fill="#FF7000" stroke="white" stroke-width="5"/>
  <circle cx="750" cy="620" r="15" fill="#FF7000" stroke="white" stroke-width="4"/>
  <circle cx="380" cy="740" r="12" fill="white"/>
  <circle cx="650" cy="710" r="10" fill="white"/>
</svg>